  hero:
    place: Blanes, Costa Brava
    title: Four rooms facing the Mediterranean, above Sant Francesc cove
    intro: >-
      A south-facing villa in a natural setting arranged for peace and quiet. Every room looks out
      to sea. The sandy beach is a few minutes' walk away; the fishing port of Blanes and lively
      Lloret de Mar are a few minutes by car.
    cta: See the rooms and prices
    photo_alt: The villa's infinity pool, which seems to spill into the sea
    facts:
      - Four rooms, every one with a sea view
      - Infinity pool, heated from May to September
      - The beach is fifteen minutes' walk away

  villa:
    title: The villa
    intro: >-
      Facing due south, Vladimir Dream House has sunshine all year round. Around the pool, five
      outdoor spaces follow the day, from breakfast to the evening aperitif.
    spaces:
      breakfast:
        name: Breakfast Corner
        text: >-
          In the shade of pine trees and lush greenery, breakfast is served above the cove and the
          beach. A fine way to start the day.
      sun_deck:
        name: Sun Deck
        text: >-
          On this terrace you could be on the prow of a ship, sunbathing towards the open sea with
          the wind in your hair.
      pool:
        name: The pool
        text: >-
          Under an azure sky, the infinity pool seems to pour into the Mediterranean. A jacuzzi to
          unwind, a counter-current to swim against, or simply the open sea to gaze at. The pool is
          heated from May to September.
      pool_deck:
        name: Pool Deck
        text: >-
          This partly shaded terrace is for breakfast, then for an afternoon nap. Dinner can also be
          served here, by the water.
      lounge:
        name: Lounge
        text: >-
          With its exotic decor, the outdoor lounge is the place for an aperitif and tapas. On hot
          summer evenings, sip a cocktail here while the sea breeze comes in.
    gallery_title: Pictures

  rooms:
    title: Rooms
    intro: >-
      All four rooms face south, with a panoramic sea view and a shared terrace or balcony.
      Non-smoking rooms, internet in the shared areas.
    price_includes: >-
      The price includes the night, breakfast for two and use of the villa's outdoor facilities.
    from_price: "From €{price} a night"
    see_room: See the room and its availability
    kinds:
      suite: Suite
      room: Room
    s-agulla:
      kind: suite
      tagline: A Caribbean mood, overlooking the pool and the open sea
      text: >-
        Named after a small cove below the villa, this suite has an exotic, Caribbean feel and a
        privileged view over the pool and the vast Mediterranean.
      features:
        - 150 × 200 cm bed
        - Shower room with walk-in shower and toilet
        - Balcony shared with Pinya de Rosa
        - Access through the house
        - Mini safe, satellite LED TV, USB socket
        - 180° sea view
    pinya-de-rosa:
      kind: suite
      tagline: Between the sea and the pine forest, with the sunrise reaching the bed
      text: >-
        To the east, a wide bay window looks over the pines of the Pinya de Rosa nature park and
        the rocky coast. To the south, the pool in the foreground and the Mediterranean as far as
        the eye can see. The rising sun reaches all the way to the bed.
      features:
        - 150 × 200 cm bed
        - Bathroom with walk-in shower, bathtub, bidet and toilet
        - Balcony shared with S'Agulla
        - Access through the house
        - Mini safe, satellite LED TV, USB socket
        - 180° sea view
    cala-bona:
      kind: room
      tagline: Named after a fishermen's cove a few hundred metres below
      text: >-
        This room takes its name from the cove a few hundred metres below. Once a favourite
        shelter for fishermen, today an anchorage for sailors on their way to Barcelona or the
        Balearics, Cala Bona is also a lovely beach with a family atmosphere.
      features:
        - 150 × 200 cm bed
        - Shower room with separate toilet
        - Air conditioning and heating
        - Terrace shared with Cala Blanca
        - Private entrance
        - Mini safe, satellite LED TV, USB socket
        - 180° sea view
    cala-blanca:
      kind: room
      tagline: White like Mediterranean architecture
      text: >-
        Light and pure, Cala Blanca puts you in tune with the blue of the sky and the sea. Its wide
        bay window opens onto a breathtaking view.
      features:
        - 150 × 200 cm bed
        - Shower room with toilet
        - Air conditioning and heating
        - Terrace shared with Cala Bona
        - Private entrance
        - Mini safe, satellite LED TV, USB socket
        - 180° sea view

