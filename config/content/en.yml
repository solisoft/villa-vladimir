  table:
    title: Dining
    lead: >-
      Typically Mediterranean cooking, made from market produce and prepared especially for each
      meal.
    paragraphs:
      - >-
        Dinner is served on request, in the evening only. To make this possible, we ask you to
        choose your menu the day before, one menu for the whole table.
      - >-
        A varied menu is given to you on arrival. The dishes follow traditional recipes learnt from
        accomplished cooks met along the way.
    dishes_intro: "Let yourself be tempted by local seafood, grilled a la plancha:"
    dishes:
      - name: Parrillada de pescado
        note: grilled fresh fish
      - name: Mariscada
        note: grilled shellfish
      - name: Navajas a la plancha
        note: grilled razor clams
      - name: Zarzuela
        note: fresh fish casserole
    more: And many other specialities, sometimes with a hint of the exotic.
    wine: >-
      In our bodega, a selection of French and Spanish wines, chosen from winegrower friends.

  surroundings:
    title: Surroundings
    intro: >-
      From the cove below to Barcelona, sorted by how long it takes to get there from the villa.
    bands:
      - label: 15 minutes on foot
        detail: 5 minutes by car
        places:
          - Sant Francesc cove beach (free private parking)
          - Social club swimming pool, 25 × 12 m, free (free private parking)
          - Social club tennis, two courts, free (free private parking)
          - Marimurtra botanical garden, Blanes
          - Sant Joan castle and tower, panoramic view over Blanes
      - label: Under 15 minutes
        detail: by car
        places:
          - Pinya de Rosa botanical garden, Blanes
          - Treumal, Sa Boadella and Fenals beaches
          - Santa Cristina beach and hermitage
          - Santa Clotilde gardens
          - Beaches and seafronts of Blanes and Lloret de Mar
          - Markets in Blanes (Monday) and Lloret de Mar (Tuesday)
          - Sea museum, Lloret de Mar
          - Boat trips between Blanes and Lloret de Mar
          - Bowling in Blanes and Lloret de Mar
          - Go-karting in Lloret de Mar and Palafolls
          - Water World, Lloret de Mar
          - Marineland, Malgrat de Mar
          - Casino and nightclubs in Lloret de Mar
      - label: Under 30 minutes
        detail: by car
        places:
          - Canyelles, Malgrat de Mar and Santa Susanna beaches
          - Tordera Sunday market and medieval castle
          - Medieval town of Tossa de Mar
          - PGA Catalunya (Caldes de Malavella), Sant Vicenç de Montalt and Lloret de Mar golf courses
      - label: Under an hour
        detail: by car
        places:
          - Barcelona, with a train every half hour from Blanes
          - Circuit de Barcelona-Catalunya, Montmeló
          - Girona and its remarkable old town
          - The northern Costa Brava, up to the French border
          - The Catalan hinterland, up to the Pyrenees
    photos_title: Around the villa

