  hero:
    place: Blanes, Costa Brava
    title: Quatre chambres face à la Méditerranée, au-dessus de la cala Sant Francesc
    intro: >-
      Une villa orientée plein sud, dans un cadre naturel aménagé pour le calme et la détente.
      Toutes les chambres ont vue sur la mer. La plage de sable est à quelques minutes à pied,
      le port de pêche de Blanes et la station animée de Lloret de Mar à quelques minutes en voiture.
    cta: Voir les chambres et les prix
    photo_alt: La piscine à débordement de la villa, qui semble se déverser dans la mer
    facts:
      - Quatre chambres, toutes avec vue sur la mer
      - Piscine à débordement chauffée de mai à septembre
      - La plage à quinze minutes à pied

  villa:
    title: La villa
    intro: >-
      Orientée plein sud, Vladimir Dream House profite du soleil toute l'année. Autour de la
      piscine, cinq espaces extérieurs suivent le fil de la journée, du petit déjeuner à l'apéritif.
    spaces:
      breakfast:
        name: Breakfast Corner
        text: >-
          À l'ombre des pins et d'une végétation luxuriante, le petit déjeuner vous attend
          au-dessus de la cala et de la plage. De quoi bien commencer la journée.
      sun_deck:
        name: Sun Deck
        text: >-
          Sur cette terrasse, on se croirait à la proue d'un navire : bains de soleil face au
          large, cheveux au vent.
      pool:
        name: La piscine
        text: >-
          Sous un ciel d'azur, la piscine à débordement semble se déverser dans la Méditerranée.
          Jacuzzi pour se détendre, nage à contre-courant pour la forme, ou simplement le regard
          perdu vers le large. Elle est chauffée de mai à septembre.
      pool_deck:
        name: Pool Deck
        text: >-
          Semi-ombragée, la terrasse accueille le petit déjeuner, puis la sieste. Le dîner d'hôte
          peut aussi y être servi, au bord de l'eau.
      lounge:
        name: Lounge
        text: >-
          Dans son décor exotique, le salon extérieur vous attend à l'heure de l'apéritif et des
          tapas. Les soirs d'été, c'est l'endroit idéal pour un cocktail en attendant la brise marine.
    gallery_title: En images

  rooms:
    title: Les chambres
    intro: >-
      Les quatre chambres sont orientées plein sud, avec une vue panoramique sur la mer et une
      terrasse ou un balcon partagé. Chambres non fumeur, Internet dans les parties communes.
    price_includes: >-
      Le prix comprend la nuit, les petits déjeuners pour deux personnes et l'accès aux
      installations extérieures de la villa.
    from_price: "À partir de {price} € la nuit"
    see_room: Voir la chambre et ses disponibilités
    kinds:
      suite: Suite
      room: Chambre
    s-agulla:
      kind: suite
      tagline: Ambiance Caraïbes, vue sur la piscine et le large
      text: >-
        Elle tient son nom d'une petite crique en contrebas de la villa. Un parfum d'exotisme
        règne dans cette suite aux accents caribéens, avec une vue privilégiée sur la piscine et
        l'immensité de la Méditerranée.
      features:
        - Lit de 150 × 200 cm
        - Salle d'eau avec douche à l'italienne et WC
        - Balcon partagé avec Pinya de Rosa
        - Accès par la maison
        - Mini coffre-fort, TV LED satellite, prise USB
        - Vue mer à 180°
    pinya-de-rosa:
      kind: suite
      tagline: Entre la mer et la pinède, le soleil levant jusque dans le lit
      text: >-
        À l'est, une large baie donne sur la pinède du parc naturel de Pinya de Rosa et la côte
        rocheuse. Au sud, la piscine au premier plan et la Méditerranée à perte de vue. Le soleil
        levant vient vous caresser jusque dans le lit.
      features:
        - Lit de 150 × 200 cm
        - Salle d'eau avec douche à l'italienne, baignoire, bidet et WC
        - Balcon partagé avec S'Agulla
        - Accès par la maison
        - Mini coffre-fort, TV LED satellite, prise USB
        - Vue mer à 180°
    cala-bona:
      kind: room
      tagline: Le nom d'une crique de pêcheurs, quelques centaines de mètres plus bas
      text: >-
        Cette chambre porte le nom de la crique qui se trouve quelques centaines de mètres en
        contrebas. Autrefois abri apprécié des pêcheurs, aujourd'hui mouillage des plaisanciers en
        route vers Barcelone ou les Baléares, Cala Bona est aussi une belle plage à l'ambiance
        familiale.
      features:
        - Lit de 150 × 200 cm
        - Salle d'eau avec douche et WC séparés
        - Climatisation réversible
        - Terrasse partagée avec Cala Blanca
        - Accès privé
        - Mini coffre-fort, TV LED satellite, prise USB
        - Vue mer à 180°
    cala-blanca:
      kind: room
      tagline: Blanche comme l'architecture méditerranéenne
      text: >-
        Empreinte de légèreté et de pureté, Cala Blanca vous met en parfaite harmonie avec l'azur
        du ciel et de la mer. Sa large baie ouvre sur un panorama à couper le souffle.
      features:
        - Lit de 150 × 200 cm
        - Salle d'eau avec douche et WC
        - Climatisation réversible
        - Terrasse partagée avec Cala Bona
        - Accès privé
        - Mini coffre-fort, TV LED satellite, prise USB
        - Vue mer à 180°

