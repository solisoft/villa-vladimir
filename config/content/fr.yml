  table:
    title: La table d'hôtes
    lead: >-
      Une cuisine méditerranéenne préparée avec les produits du marché, cuisinée spécialement pour
      chaque repas.
    paragraphs:
      - >-
        Le dîner est servi sur demande, le soir uniquement. Pour tenir cet engagement, nous vous
        demandons de choisir votre menu la veille, le même pour toute la table.
      - >-
        Une carte variée vous est proposée dès votre arrivée. Les plats suivent des recettes
        traditionnelles, apprises au fil des rencontres avec des cuisinières de talent.
    dishes_intro: "Laissez-vous tenter par les spécialités de la mer, à la plancha :"
    dishes:
      - name: Parrillada de pescado
        note: grillade de poissons frais
      - name: Mariscada
        note: crustacés à la plancha
      - name: Navajas a la plancha
        note: couteaux grillés
      - name: Zarzuela
        note: marmite de poissons frais
    more: Et bien d'autres spécialités, parfois teintées d'un brin d'exotisme.
    wine: >-
      Dans notre bodega, une sélection de vins français et espagnols, choisis chez des vignerons
      amis.

