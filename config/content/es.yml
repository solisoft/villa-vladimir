    title: Vladimir Dream House – habitaciones con vistas al mar en Blanes, Costa Brava
    description: >-
      Cuatro habitaciones con vistas al mar sobre la cala Sant Francesc, en Blanes. Piscina
      desbordante climatizada, cenas caseras, disponibilidad y precios en línea.
  skip: Ir al contenido
