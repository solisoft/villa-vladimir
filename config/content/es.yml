  table:
    title: Cenas caseras
    lead: >-
      Una cocina típicamente mediterránea, elaborada con productos del mercado y preparada
      especialmente para cada comida.
    paragraphs:
      - >-
        La cena se sirve bajo petición, solo por la noche. Para poder cumplirlo, le pedimos que
        elija su menú el día anterior, el mismo para toda la mesa.
      - >-
        A su llegada le presentamos una carta variada. Los platos siguen recetas tradicionales,
        aprendidas de reconocidas cocineras a lo largo de los años.
    dishes_intro: "Déjese tentar por las especialidades del mar, a la plancha:"
    dishes:
      - name: Parrillada de pescado
        note: pescado fresco a la plancha
      - name: Mariscada
        note: marisco a la plancha
      - name: Navajas a la plancha
        note: navajas a la brasa
      - name: Zarzuela
        note: cazuela de pescado fresco
    more: Y muchas otras especialidades, a veces con un toque exótico.
    wine: >-
      En nuestra bodega, una selección de vinos franceses y españoles, elegidos en casa de
      viticultores amigos.

  surroundings:
    title: Alrededores
    intro: >-
      De la cala de abajo hasta Barcelona, ordenados por el tiempo que se tarda en llegar desde la
      villa.
    bands:
