  hero:
    place: Blanes, Costa Brava
    title: Cuatro habitaciones frente al Mediterráneo, sobre la cala Sant Francesc
    intro: >-
      Una villa orientada al sur, en un entorno natural preparado para la calma y el descanso.
      Todas las habitaciones tienen vistas al mar. La playa de arena está a pocos minutos a pie; el
      puerto pesquero de Blanes y la animada Lloret de Mar, a pocos minutos en coche.
    cta: Ver las habitaciones y los precios
    photo_alt: La piscina desbordante de la villa, que parece verterse en el mar
    facts:
      - Cuatro habitaciones, todas con vistas al mar
      - Piscina desbordante climatizada de mayo a septiembre
      - La playa a quince minutos a pie

  villa:
    title: La villa
    intro: >-
      Orientada al sur, Vladimir Dream House tiene sol todo el año. Alrededor de la piscina, cinco
      espacios exteriores acompañan el día, del desayuno al aperitivo.
    spaces:
      breakfast:
        name: Breakfast Corner
        text: >-
          A la sombra de los pinos y de una vegetación exuberante, el desayuno le espera sobre la
          cala y la playa. Una buena manera de empezar el día.
      sun_deck:
        name: Sun Deck
        text: >-
          En esta terraza se sentirá en la proa de un barco: baños de sol frente al mar abierto, con
          el viento en el pelo.
      pool:
        name: La piscina
        text: >-
          Bajo un cielo azul, la piscina desbordante parece verterse en el Mediterráneo. Jacuzzi
          para relajarse, nado contracorriente para mantenerse en forma, o simplemente la mirada
          perdida en el horizonte. Está climatizada de mayo a septiembre.
      pool_deck:
        name: Pool Deck
        text: >-
          Esta terraza semisombreada acoge el desayuno y después la siesta. La cena también puede
          servirse aquí, junto al agua.
      lounge:
        name: Lounge
        text: >-
          Con su decoración exótica, el salón exterior le espera a la hora del aperitivo y las tapas.
          Las noches de verano, es el lugar ideal para un cóctel mientras llega la brisa del mar.
    gallery_title: En imágenes

  rooms:
    title: Habitaciones
    intro: >-
      Las cuatro habitaciones están orientadas al sur, con vistas panorámicas al mar y terraza o
      balcón compartido. Habitaciones para no fumadores, internet en las zonas comunes.
    price_includes: >-
      El precio incluye la noche, los desayunos para dos personas y el acceso a las instalaciones
      exteriores de la villa.
    from_price: "Desde {price} € la noche"
    see_room: Ver la habitación y su disponibilidad
    kinds:
      suite: Suite
      room: Habitación
    s-agulla:
      kind: suite
      tagline: Ambiente caribeño, con vistas a la piscina y al mar abierto
      text: >-
        Toma su nombre de una pequeña cala situada más abajo de la villa. Un perfume exótico reina
        en esta suite de ambiente caribeño, con vistas privilegiadas a la piscina y a la inmensidad
        del Mediterráneo.
      features:
        - Cama de 150 × 200 cm
        - Baño con ducha a ras de suelo e inodoro
        - Balcón compartido con Pinya de Rosa
        - Acceso por la casa
        - Minicaja fuerte, TV LED por satélite, toma USB
        - Vistas al mar de 180°
    pinya-de-rosa:
      kind: suite
      tagline: Entre el mar y el pinar, con la salida del sol hasta la cama
      text: >-
        Al este, un amplio ventanal se abre al pinar del parque natural de Pinya de Rosa y a la
        costa rocosa. Al sur, la piscina en primer plano y el Mediterráneo hasta perderse de vista.
        La salida del sol llega a acariciarle hasta en la cama.
      features:
        - Cama de 150 × 200 cm
        - Baño con ducha a ras de suelo, bañera, bidé e inodoro
        - Balcón compartido con S'Agulla
        - Acceso por la casa
        - Minicaja fuerte, TV LED por satélite, toma USB
        - Vistas al mar de 180°
    cala-bona:
      kind: room
      tagline: El nombre de una cala de pescadores, unos cientos de metros más abajo
      text: >-
        Esta habitación lleva el nombre de la cala que se encuentra unos cientos de metros más
        abajo. Antaño refugio apreciado por los pescadores, hoy fondeadero de los navegantes rumbo a
        Barcelona o a las Baleares, Cala Bona es también una preciosa playa de ambiente familiar.
      features:
        - Cama de 150 × 200 cm
        - Baño con ducha e inodoro separado
        - Aire acondicionado con bomba de calor
        - Terraza compartida con Cala Blanca
        - Acceso privado
        - Minicaja fuerte, TV LED por satélite, toma USB
        - Vistas al mar de 180°
    cala-blanca:
      kind: room
      tagline: Blanca como la arquitectura mediterránea
      text: >-
        Ligera y pura, Cala Blanca le pone en perfecta armonía con el azul del cielo y del mar. Su
        amplio ventanal se abre a un panorama impresionante.
      features:
        - Cama de 150 × 200 cm
        - Baño con ducha e inodoro
        - Aire acondicionado con bomba de calor
        - Terraza compartida con Cala Bona
        - Acceso privado
        - Minicaja fuerte, TV LED por satélite, toma USB
        - Vistas al mar de 180°

