        detail: 5 minutos en coche
        places:
          - Playa de la cala Sant Francesc (aparcamiento privado gratuito)
          - Piscina del club social, 25 × 12 m, gratuita (aparcamiento privado gratuito)
          - Tenis del club social, dos pistas, gratuitas (aparcamiento privado gratuito)
          - Jardín botánico Marimurtra, Blanes
          - Castillo de Sant Joan y su torre, vista panorámica sobre Blanes
      - label: A menos de 15 minutos
        detail: en coche
        places:
          - Jardín botánico Pinya de Rosa, Blanes
          - Playas de Treumal, Sa Boadella y Fenals
          - Playa y ermita de Santa Cristina
          - Jardines de Santa Clotilde
          - Playas y paseos marítimos de Blanes y Lloret de Mar
          - Mercados de Blanes (lunes) y Lloret de Mar (martes)
          - Museo del mar, Lloret de Mar
          - Paseos en barco entre Blanes y Lloret de Mar
          - Boleras de Blanes y Lloret de Mar
          - Karting en Lloret de Mar y Palafolls
          - Water World, Lloret de Mar
          - Marineland, Malgrat de Mar
          - Casino y discotecas de Lloret de Mar
      - label: A menos de 30 minutos
        detail: en coche
        places:
          - Playas de Canyelles, Malgrat de Mar y Santa Susanna
          - Mercado dominical y castillo medieval de Tordera
          - Villa medieval de Tossa de Mar
          - Campos de golf PGA Catalunya (Caldes de Malavella), Sant Vicenç de Montalt y Lloret de Mar
      - label: A menos de una hora
        detail: en coche
        places:
          - Barcelona, con un tren cada media hora desde Blanes
          - Circuit de Barcelona-Catalunya, Montmeló
          - Girona y su notable casco antiguo
          - La Costa Brava norte, hasta la frontera francesa
          - El interior de Cataluña, hasta los Pirineos
    photos_title: Alrededor de la villa

